name: Idea or feature request
description: Suggest something new.
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What should it do, and why would it help?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other ways you thought of, or mods that already do something like it.
